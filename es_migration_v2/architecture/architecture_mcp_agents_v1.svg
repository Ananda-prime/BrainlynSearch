    <rect x="60" y="665" width="400" height="28" rx="6" fill="#c084fc" fill-opacity="0.2"/>
    <text x="70" y="684" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1">LAYER 3: SPECIALIZED AUTONOMOUS EXTRACTION AGENTS</text>

    <!-- Agent 1 -->
