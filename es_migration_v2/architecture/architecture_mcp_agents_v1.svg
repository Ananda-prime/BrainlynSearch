  <text x="1195" y="70" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">MODEL CONTEXT PROTOCOL (MCP)</text>

  <!-- LAYER 1: CLIENT & MCP HOST -->
  <g id="layer-1">
    <rect x="40" y="130" width="1320" height="180" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="145" width="310" height="28" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="70" y="164" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">LAYER 1: CLIENT &amp; MCP HOST INTERFACE</text>

    <!-- Card 1.1 -->
    <rect x="70" y="190" width="580" height="95" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="105" cy="225" r="18" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="105" y="231" fill="#38bdf8" font-size="16" text-anchor="middle">💻</text>
    <text x="140" y="222" fill="#f8fafc" font-size="15" font-weight="600">User Web Dashboard / API Clients</text>
    <text x="140" y="244" fill="#94a3b8" font-size="12">React UI / FastAPI Gateway / REST &amp; WebSocket Client Requests</text>

    <!-- Card 1.2 -->
    <rect x="750" y="190" width="580" height="95" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="785" cy="225" r="18" fill="#c084fc" fill-opacity="0.2"/>
    <text x="785" y="231" fill="#c084fc" font-size="16" text-anchor="middle">🤖</text>
    <text x="820" y="222" fill="#f8fafc" font-size="15" font-weight="600">MCP Host Integration</text>
    <text x="820" y="244" fill="#94a3b8" font-size="12">Claude Desktop / Cursor IDE / Standard JSON-RPC 2.0 Host Protocol</text>
  </g>

  <!-- ARROWS L1 -> L2 -->
  <path d="M 360 285 L 360 350" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
  <path d="M 1040 285 L 1040 350" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>

  <!-- LAYER 2: CENTRAL ORCHESTRATOR & MCP CORE -->
  <g id="layer-2">
    <rect x="40" y="360" width="1320" height="230" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="375" width="370" height="28" rx="6" fill="#818cf8" fill-opacity="0.2"/>
    <text x="70" y="394" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">LAYER 2: CENTRAL AI ORCHESTRATOR &amp; MCP CORE SERVER</text>

    <!-- Card 2.1 -->
    <rect x="70" y="420" width="380" height="145" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="95" y="450" fill="#f8fafc" font-size="15" font-weight="600">Central Master Router &amp; Planner</text>
    <text x="95" y="475" fill="#94a3b8" font-size="12">• Intent Classification &amp; Task Breakdown</text>
    <text x="95" y="495" fill="#94a3b8" font-size="12">• Multi-Agent Execution Dependency Tree</text>
    <text x="95" y="515" fill="#94a3b8" font-size="12">• Real-time Context &amp; Session Memory</text>

    <!-- Card 2.2 -->
    <rect x="480" y="420" width="440" height="145" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="505" y="450" fill="#f8fafc" font-size="15" font-weight="600">MCP Protocol Hub (Tools &amp; Resources)</text>
    <text x="505" y="475" fill="#38bdf8" font-size="12" font-family="monospace">Tool Registry: scrape_site(), solve_captcha()</text>
    <text x="505" y="495" fill="#38bdf8" font-size="12" font-family="monospace">Resource URIs: legal://schema, mca://template</text>
    <text x="505" y="515" fill="#38bdf8" font-size="12" font-family="monospace">Prompt Manager: System Prompts &amp; Format Guards</text>

    <!-- Card 2.3 -->
    <rect x="950" y="420" width="380" height="145" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="975" y="450" fill="#f8fafc" font-size="15" font-weight="600">Multi-Agent Data Synthesizer</text>
    <text x="975" y="475" fill="#94a3b8" font-size="12">• Cross-Source Entity Deduplication</text>
    <text x="975" y="495" fill="#94a3b8" font-size="12">• Structured JSON Payload Merger</text>
    <text x="975" y="515" fill="#94a3b8" font-size="12">• Final Report &amp; UI Data Formatter</text>
  </g>

  <!-- ARROWS L2 -> L3 (Trunk line dispatching to 4 Agents) -->
  <path d="M 700 565 L 700 640" stroke="#c084fc" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <rect x="610" y="590" width="180" height="24" rx="12" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1"/>
  <text x="700" y="606" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">DISPATCH AGENT TASKS</text>

