    <text x="410" y="765" fill="#c084fc" font-size="11" font-weight="600">Target: MCA21, Zauba Corporate</text>
    <text x="410" y="790" fill="#94a3b8" font-size="11">• Company Filings &amp; DIN</text>
    <text x="410" y="810" fill="#94a3b8" font-size="11">• Extract Director History</text>
    <text x="410" y="830" fill="#94a3b8" font-size="11">• Financial Indexing</text>
    <rect x="410" y="850" width="150" height="20" rx="4" fill="#34d399" fill-opacity="0.15"/>
    <text x="485" y="864" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Output: Company Record JSON</text>

    <!-- Agent 3 -->
    <rect x="710" y="710" width="300" height="175" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <text x="730" y="740" fill="#f8fafc" font-size="14" font-weight="700">🗳️ Voter &amp; Public Agent</text>
    <text x="730" y="765" fill="#c084fc" font-size="11" font-weight="600">Target: Electoral &amp; Land Portals</text>
    <text x="730" y="790" fill="#94a3b8" font-size="11">• Electoral Search</text>
    <text x="730" y="810" fill="#94a3b8" font-size="11">• Address Verification</text>
    <text x="730" y="830" fill="#94a3b8" font-size="11">• Record Match Engine</text>
    <rect x="730" y="850" width="140" height="20" rx="4" fill="#34d399" fill-opacity="0.15"/>
    <text x="800" y="864" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Output: Citizen Data JSON</text>

    <!-- Agent 4 -->
    <rect x="1030" y="710" width="300" height="175" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1050" y="740" fill="#f8fafc" font-size="14" font-weight="700">🌐 Web &amp; News Agent</text>
    <text x="1050" y="765" fill="#c084fc" font-size="11" font-weight="600">Target: SERP, Google News, Portals</text>
    <text x="1050" y="790" fill="#94a3b8" font-size="11">• Dynamic Web Crawl</text>
    <text x="1050" y="810" fill="#94a3b8" font-size="11">• Adverse News Extraction</text>
    <text x="1050" y="830" fill="#94a3b8" font-size="11">• Custom URL DOM Parse</text>
    <rect x="1050" y="850" width="150" height="20" rx="4" fill="#34d399" fill-opacity="0.15"/>
    <text x="1125" y="864" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Output: Web Intelligence JSON</text>
  </g>

  <!-- ARROWS L3 -> L4 -->
  <path d="M 220 885 L 220 950" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 540 885 L 540 950" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 860 885 L 860 950" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 1180 885 L 1180 950" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- LAYER 4: WEBSITE CONNECTOR & EXECUTION ENGINE -->
  <g id="layer-4">
    <rect x="40" y="960" width="1320" height="240" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="975" width="410" height="28" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="70" y="994" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">LAYER 4: WEBSITE CONNECTOR &amp; ANTI-BOT INFRASTRUCTURE</text>

    <!-- Infra 4.1 -->
    <rect x="70" y="1020" width="300" height="100" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="90" y="1050" fill="#f8fafc" font-size="14" font-weight="600">Headless Browser Engine</text>
    <text x="90" y="1075" fill="#94a3b8" font-size="12">Playwright / Undetected Chrome</text>
    <text x="90" y="1095" fill="#94a3b8" font-size="11">Automates DOM &amp; JS Execution</text>

    <!-- Infra 4.2 -->
    <rect x="390" y="1020" width="300" height="100" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="410" y="1050" fill="#f8fafc" font-size="14" font-weight="600">AI CAPTCHA &amp; Anti-Bot Solver</text>
    <text x="410" y="1075" fill="#94a3b8" font-size="12">Vision OCR LLM + 2Captcha API</text>
    <text x="410" y="1095" fill="#94a3b8" font-size="11">Bypasses Captchas &amp; Cloudflare</text>

    <!-- Infra 4.3 -->
    <rect x="710" y="1020" width="300" height="100" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="730" y="1050" fill="#f8fafc" font-size="14" font-weight="600">Proxy Router &amp; Parser</text>
    <text x="730" y="1075" fill="#94a3b8" font-size="12">Rotating Residential IP Pool</text>
    <text x="730" y="1095" fill="#94a3b8" font-size="11">BeautifulSoup &amp; PDF OCR</text>

    <!-- Target Sites Box -->
    <rect x="1030" y="1020" width="300" height="155" rx="12" fill="#450a0a" stroke="#f43f5e" stroke-width="2"/>
    <text x="1050" y="1050" fill="#fca5a5" font-size="14" font-weight="700">🔴 TARGET WEBSITES &amp; PORTALS</text>
    <text x="1050" y="1075" fill="#f8fafc" font-size="12">• eCourts / High Court Portals</text>
    <text x="1050" y="1095" fill="#f8fafc" font-size="12">• MCA21 / Ministry of Corp Affairs</text>
    <text x="1050" y="1115" fill="#f8fafc" font-size="12">• State Electoral &amp; Voter Sites</text>
    <text x="1050" y="1135" fill="#f8fafc" font-size="12">• Public News &amp; Web Engine</text>

    <!-- Connection lines to target sites -->
    <path d="M 370 1070 L 1030 1070" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  </g>

  <!-- ARROWS L4 -> L5 -->
  <path d="M 700 1200 L 700 1260" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="580" y="1215" width="240" height="24" rx="12" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
  <text x="700" y="1231" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">PYDANTIC VALIDATED PAYLOADS</text>

  <!-- LAYER 5: DATA PERSISTENCE & SEARCH INDEX -->
  <g id="layer-5">
    <rect x="40" y="1270" width="1320" height="230" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
    <rect x="60" y="1285" width="410" height="28" rx="6" fill="#34d399" fill-opacity="0.2"/>
    <text x="70" y="1304" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">LAYER 5: DATA VALIDATION, INDEXING &amp; STORAGE</text>

    <!-- DB 5.1 -->
    <rect x="70" y="1330" width="280" height="140" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="90" y="1360" fill="#f8fafc" font-size="15" font-weight="600">🛡️ Pydantic Schema Guard</text>
    <text x="90" y="1385" fill="#94a3b8" font-size="12">• Strict Field Typing</text>
    <text x="90" y="1405" fill="#94a3b8" font-size="12">• Non-Null Data Enforcement</text>
    <text x="90" y="1425" fill="#94a3b8" font-size="12">• Automatic JSON Normalizer</text>

    <!-- DB 5.2 -->
    <rect x="380" y="1330" width="300" height="140" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="400" y="1360" fill="#f8fafc" font-size="15" font-weight="600">🔍 Elasticsearch 8.x Index</text>
    <text x="400" y="1385" fill="#94a3b8" font-size="12">• Hybrid Vector + BM25 Search</text>
    <text x="400" y="1405" fill="#94a3b8" font-size="12">• Dense Embeddings Store</text>
    <text x="400" y="1425" fill="#94a3b8" font-size="12">• Ultra-Fast Sub-Second Queries</text>

    <!-- DB 5.3 -->
    <rect x="710" y="1330" width="300" height="140" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="730" y="1360" fill="#f8fafc" font-size="15" font-weight="600">🐘 Neon PostgreSQL DB</text>
    <text x="730" y="1385" fill="#94a3b8" font-size="12">• Relational Entity Store</text>
    <text x="730" y="1405" fill="#94a3b8" font-size="12">• User Auth &amp; History Logs</text>
    <text x="730" y="1425" fill="#94a3b8" font-size="12">• ACID Compliance</text>

    <!-- DB 5.4 -->
    <rect x="1040" y="1330" width="280" height="140" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="1060" y="1360" fill="#f8fafc" font-size="15" font-weight="600">⚡ Redis Cache Server</text>
    <text x="1060" y="1385" fill="#94a3b8" font-size="12">• Rapid Session Caching</text>
    <text x="1060" y="1405" fill="#94a3b8" font-size="12">• Deduplication Cache Key</text>
    <text x="1060" y="1425" fill="#94a3b8" font-size="12">• Live Stream Response Queue</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="1530" width="1320" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="700" y="1560" fill="#94a3b8" font-size="12" text-anchor="middle">✨ Seamless End-to-End Flow: Client Query → Orchestrator → MCP Tools → Web Agents → Anti-Bot Scrape → Pydantic Format → Elasticsearch / Neon DB</text>
</svg>