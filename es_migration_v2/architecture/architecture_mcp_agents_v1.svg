    <text x="90" y="740" fill="#f8fafc" font-size="14" font-weight="700">⚖️ Legal &amp; Court Agent</text>
    <text x="90" y="765" fill="#c084fc" font-size="11" font-weight="600">Target: eCourts, High Courts</text>
    <text x="90" y="790" fill="#94a3b8" font-size="11">• Search Cause Lists</text>
    <text x="90" y="810" fill="#94a3b8" font-size="11">• Extract Case Orders/PDFs</text>
    <text x="90" y="830" fill="#94a3b8" font-size="11">• Parse Litigant Details</text>
    <rect x="90" y="850" width="140" height="20" rx="4" fill="#34d399" fill-opacity="0.15"/>
    <text x="160" y="864" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Output: Legal Case JSON</text>

    <!-- Agent 2 -->
    <rect x="390" y="710" width="300" height="175" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
