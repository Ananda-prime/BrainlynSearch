<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2000" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="30" width="1420" height="75" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="70" y="70" fill="#f8fafc" font-size="22" font-weight="700">DIAGRAM 2: 4-PHASE ECOURTS EXTRACTION FLOW &amp; DECISION NODE</text>
  <rect x="1140" y="52" width="290" height="32" rx="16" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
  <text x="1285" y="73" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">4-PHASE LIVE EXTRACTION PIPELINE</text>

  <!-- PHASE 1 -->
  <g id="phase-1">
    <rect x="70" y="140" width="1360" height="170" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="85" y="155" width="290" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="95" y="173" fill="#38bdf8" font-size="12" font-weight="700">PHASE 1: ACCESS &amp; PORTAL ENTRY</text>

    <rect x="95" y="195" width="380" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="225" fill="#f8fafc" font-size="13" font-weight="600">1. Portal Selection</text>
    <text x="110" y="250" fill="#94a3b8" font-size="11">Open eCourts Portal / Mobile App API</text>

    <rect x="510" y="195" width="380" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="525" y="225" fill="#f8fafc" font-size="13" font-weight="600">2. Court Level Selection</text>
    <text x="525" y="250" fill="#94a3b8" font-size="11">High Court vs District &amp; Taluka Courts</text>

    <rect x="925" y="195" width="380" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="940" y="225" fill="#f8fafc" font-size="13" font-weight="600">3. Geographic Filtering</text>
    <text x="940" y="250" fill="#94a3b8" font-size="11">Select State &amp; District Dropdown Options</text>
  </g>

  <path d="M 750 310 L 750 350" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- PHASE 2 DECISION NODE -->
  <g id="phase-2">
    <rect x="70" y="350" width="1360" height="230" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="85" y="365" width="410" height="26" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="95" y="383" fill="#fbbf24" font-size="12" font-weight="700">PHASE 2: CHOOSING SEARCH VECTOR (DECISION NODE)</text>

    <polygon points="750,405 920,455 750,505 580,455" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="750" y="450" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">Do you have 16-char</text>
    <text x="750" y="468" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">CNR Number?</text>

    <path d="M 920 455 L 1150 455 L 1150 525" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="960" y="430" width="120" height="22" rx="4" fill="#34d399" fill-opacity="0.2"/>
    <text x="1020" y="445" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">IF YES (Instant Path)</text>
    <rect x="1000" y="525" width="300" height="40" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="1150" y="550" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">Enter 16-char CNR ➔ Skip to Phase 4</text>

    <path d="M 580 455 L 350 455 L 350 525" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="420" y="430" width="120" height="22" rx="4" fill="#c084fc" fill-opacity="0.2"/>
    <text x="480" y="445" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">IF NO (Standard Path)</text>
    <rect x="200" y="525" width="300" height="40" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="350" y="550" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">Search Case Status / Party ➔ Phase 3</text>
  </g>

  <path d="M 350 580 L 350 620" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- PHASE 3 -->
  <g id="phase-3">
    <rect x="70" y="630" width="1360" height="290" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="85" y="645" width="380" height="26" rx="6" fill="#c084fc" fill-opacity="0.2"/>
    <text x="95" y="663" fill="#c084fc" font-size="12" font-weight="700">PHASE 3: PORTAL DATA ENTRY &amp; CAPTCHA BYPASS</text>

    <rect x="95" y="685" width="1310" height="45" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="110" y="712" fill="#f8fafc" font-size="13" font-weight="600">1. Court Complex Selection:</text>
    <text x="320" y="712" fill="#94a3b8" font-size="12">Select exact establishment / court complex from list</text>

    <rect x="95" y="745" width="310" height="90" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="110" y="772" fill="#c084fc" font-size="12" font-weight="700">Option A: Party Name</text>
    <text x="110" y="792" fill="#94a3b8" font-size="11">Full Name, Petitioner/Respondent,</text>
    <text x="110" y="810" fill="#94a3b8" font-size="11">Registration Year</text>

    <rect x="425" y="745" width="310" height="90" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="440" y="772" fill="#c084fc" font-size="12" font-weight="700">Option B: Case Number</text>
    <text x="440" y="792" fill="#94a3b8" font-size="11">Case Type, Case Number,</text>
    <text x="440" y="810" fill="#94a3b8" font-size="11">Registration Year</text>

    <rect x="755" y="745" width="310" height="90" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="770" y="772" fill="#c084fc" font-size="12" font-weight="700">Option C: Filing Number</text>
    <text x="770" y="792" fill="#94a3b8" font-size="11">Filing Number &amp;</text>
    <text x="770" y="810" fill="#94a3b8" font-size="11">Filing Year</text>

    <rect x="1085" y="745" width="320" height="90" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="1100" y="772" fill="#c084fc" font-size="12" font-weight="700">Option D: Advocate Name</text>
    <text x="1100" y="792" fill="#94a3b8" font-size="11">Lawyer Name &amp;</text>
    <text x="1100" y="810" fill="#94a3b8" font-size="11">Year</text>

    <rect x="95" y="850" width="1310" height="50" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
    <text x="110" y="880" fill="#f8fafc" font-size="13" font-weight="700">🔒 Captcha Solver MCP Tool:</text>
    <text x="320" y="880" fill="#c084fc" font-size="12">AI Vision OCR parses Captcha image ➔ Submits Form ➔ Clicks "Search / Go"</text>
  </g>

  <path d="M 750 920 L 750 960" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- PHASE 4 -->
  <g id="phase-4">
    <rect x="70" y="960" width="1360" height="350" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="85" y="975" width="460" height="26" rx="6" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="95" y="993" fill="#f43f5e" font-size="12" font-weight="700">PHASE 4: VERIFICATION, EXTRACTION &amp; PDF DOWNLOAD</text>

    <rect x="95" y="1015" width="640" height="75" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="110" y="1042" fill="#fbbf24" font-size="13" font-weight="700">Table Evaluation &amp; Fuzzy Loopback</text>
    <text x="110" y="1065" fill="#94a3b8" font-size="11">If No Match: Fuzzy spelling retry &amp; Year ±1 loopback to Phase 3.</text>

    <rect x="765" y="1015" width="640" height="75" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="780" y="1042" fill="#34d399" font-size="13" font-weight="700">Target Match Identified</text>
    <text x="780" y="1065" fill="#94a3b8" font-size="11">Locates individual target row ➔ Clicks "View / Case Details".</text>

    <rect x="95" y="1105" width="310" height="185" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="110" y="1135" fill="#f8fafc" font-size="14" font-weight="700">📌 Case Status</text>
    <text x="110" y="1160" fill="#f43f5e" font-size="12" font-weight="600">Pending / Disposed</text>
    <text x="110" y="1185" fill="#94a3b8" font-size="11">• Stage of Case</text>
    <text x="110" y="1205" fill="#94a3b8" font-size="11">• Forum / Bench Details</text>
    <text x="110" y="1225" fill="#94a3b8" font-size="11">• Coram / Judge Name</text>

    <rect x="425" y="1105" width="310" height="185" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="440" y="1135" fill="#f8fafc" font-size="14" font-weight="700">📅 Next Hearing Date</text>
    <text x="440" y="1160" fill="#f43f5e" font-size="12" font-weight="600">Upcoming Schedule</text>
    <text x="440" y="1185" fill="#94a3b8" font-size="11">• Next Date of Hearing</text>
    <text x="440" y="1205" fill="#94a3b8" font-size="11">• Purpose of Hearing</text>
    <text x="440" y="1225" fill="#94a3b8" font-size="11">• Court Room No</text>

    <rect x="755" y="1105" width="310" height="185" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="770" y="1135" fill="#f8fafc" font-size="14" font-weight="700">📜 Case History</text>
    <text x="770" y="1160" fill="#f43f5e" font-size="12" font-weight="600">Chronological Timeline</text>
    <text x="770" y="1185" fill="#94a3b8" font-size="11">• Historical Business</text>
    <text x="770" y="1205" fill="#94a3b8" font-size="11">• Hearing Dates List</text>
    <text x="770" y="1225" fill="#94a3b8" font-size="11">• Past Orders Overview</text>

    <rect x="1085" y="1105" width="320" height="185" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="1100" y="1135" fill="#f8fafc" font-size="14" font-weight="700">📄 Orders &amp; Judgments</text>
    <text x="1100" y="1160" fill="#f43f5e" font-size="12" font-weight="600">Download Signed PDFs</text>
    <text x="1100" y="1185" fill="#94a3b8" font-size="11">• Order PDF Scraper</text>
    <text x="1100" y="1205" fill="#94a3b8" font-size="11">• Vision OCR PDF Parser</text>
    <text x="1100" y="1225" fill="#94a3b8" font-size="11">• Key Ruling Extraction</text>
  </g>
</svg>