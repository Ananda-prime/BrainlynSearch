version: "3.9"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: brainlynsearch-es
    hostname: brainlynsearch-es
    command: >
      bash -c "
        if ! bin/elasticsearch-plugin list | grep -q analysis-phonetic; then
          bin/elasticsearch-plugin install --batch analysis-phonetic analysis-icu;
        fi;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9201:9200"
    volumes:
      - brainlynsearch_es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    container_name: brainlynsearch-redis
    ports:
      - "6380:6379"

volumes:
  brainlynsearch_es_data:
